spring.application.name=hyperliquid-trader

# Endpoint público de datos de mercado. No permite enviar órdenes.
hyperliquid.info-url=https://api.hyperliquid.xyz/info
hyperliquid.coin=ETH
hyperliquid.interval=15m
hyperliquid.quote-asset=USDC
# Public address used only by the read-only ACCOUNT_CHECK mode; it is not a signing key.
hyperliquid.account.address=

# Por seguridad, la aplicación usa velas sintéticas hasta que se solicite
# explícitamente la fuente real o un dataset CSV guardado.
trading.data-source=synthetic
trading.candle-count=500
trading.mode=BACKTEST
# Para reproducir un dataset: --trading.data-source=csv --trading.csv-path=data/backtests/archivo.csv
trading.csv-path=

# standard ejecuta el backtest habitual. out-of-sample evalua el ultimo 30% cronologico
# de un CSV fijo, reservando el 70% inicial como periodo de desarrollo.
trading.evaluation=standard
trading.strategy.allow-longs=true
trading.strategy.allow-shorts=false
trading.backtest.strategy=EMA_CROSS
trading.backtest.fee-rate=0.00045
trading.backtest.slippage-rate=0.00010
# Solo para backtest; 0 desactiva el objetivo. PAPER no lo consume.
trading.backtest.take-profit-percentage=0

# Paper trading is opt-in. These values do not enable signed or real orders.
trading.paper.starting-capital=20
trading.paper.state-path=data/paper/state.properties
trading.paper.strategy=EMA_CROSS
trading.paper.poll-seconds=15
