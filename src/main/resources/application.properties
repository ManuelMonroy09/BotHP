spring.application.name=hyperliquid-trader

# Endpoint público de datos de mercado. No permite enviar órdenes.
hyperliquid.info-url=https://api.hyperliquid.xyz/info
hyperliquid.coin=ETH
hyperliquid.interval=15m

# Por seguridad, la aplicación usa velas sintéticas hasta que se solicite
# explícitamente la fuente real o un dataset CSV guardado.
trading.data-source=synthetic
trading.candle-count=500
# Para reproducir un dataset: --trading.data-source=csv --trading.csv-path=data/backtests/archivo.csv
trading.csv-path=
